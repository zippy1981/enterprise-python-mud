id: backpack_burrow
name: The Backpack Burrow
order: 15
zone: Packages, virtual environments & uv
description: |
  A cosy burrow under the roots of an enormous oak. Rows of little backpacks
  hang on pegs, each one stitched with a project's name. A badger in a tool
  belt packs them at lightning speed, ticking items off a long packing list,
  while a tiny violet sprite zips about fetching tools from the shelves.
exits:
  south: backpack_burrow_guided
  north: looping_lagoon_guided
npc:
  name: Barnaby the Badger
  aliases: [barnaby, badger]
  greeting: |
    "Come in, come in! Wipe your paws. You've been writing all your code
    yourself so far, which is brilliant. But real coders also use code that
    **other people** wrote and shared. Those bundles of code are called
    **packages**.

    Here's the thing: every project needs its **own backpack** for its
    packages, so different projects don't get their tools muddled up. That
    backpack is called a **virtual environment**.

    And the fastest packer in the forest is my friend **uv**. *(That's the little
    violet sprite zooming about.)* Let's pack your project its very own
    backpack!"
  topics:
    pypi: |
      "There's a giant online library of packages called **PyPI** (say
      'pie-pee-eye'), the Python Package Index. Over half a million packages live
      there! `uv add cowsay` downloads the `cowsay` package from PyPI and puts it
      in your backpack."
    safety: |
      "Only install packages you've heard of, or that a grown-up or teacher
      recommends. Check the spelling, too: sneaky people sometimes publish
      packages with names *almost* like popular ones, hoping you'll make a typo.
      `cowsay` is the real one!"
    no workspace: |
      "`uv init --bare --no-workspace` has two extras:
      * `--bare` means 'just make the packing list, nothing else'
      * `--no-workspace` means 'this is its own project, don't join it to some
        bigger project in a folder above'

      If you forgot it and uv said *Adding critter-quest as member of
      workspace ...*, ask a grown-up to help you undo that: delete the
      `[tool.uv.workspace]` lines it added to the other folder's
      `pyproject.toml`, then try again."
    activate: |
      "Outside the game you can 'step into' a backpack so that `python` means
      the backpack's Python. That's called **activating** it:
      * Windows: `.venv\Scripts\activate`
      * Mac/Linux: `source .venv/bin/activate`

      But with uv you rarely need to. `uv run python fun.py` uses the backpack
      automatically, and so do the game's `python` and `pytest` commands."
    dev: |
      "`uv add --dev pytest` puts pytest in a special **dev** pocket. That
      means 'a tool for making the project', not 'a part of the game'. Players
      of your game don't need pytest, but you do!"
pages:
  - title: Packages are code you can borrow
    body: |
      Remember Scratch **extensions**? You click *Add Extension*, choose *Pen*
      or *Music*, and suddenly you have new blocks someone else made.

      Python's version is **packages**. Someone writes some useful code, shares
      it on **PyPI** (a huge online library), and anyone can borrow it.

      ```python
      import cowsay                  # borrow the cowsay package
      cowsay.cow("Moo! I'm a cow.")  # use one of its functions
      ```

      ```
        _______________
      | Moo! I'm a cow. |
        ===============
              \
               ^__^
               (oo)\_______
      ```

      You've already used code you didn't write: `print`, `min` and `max`
      come built into Python. Packages are the same idea, from outside.
  - title: Every project gets its own backpack
    body: |
      Imagine you and your friend share **one** pencil case. You need a
      blue pen for art; they swap it for a red one for maths. Chaos!

      Python has the same problem. If every project shares one big pile of
      packages, they clash. The fix is a **virtual environment**: each project
      gets its **own backpack** with its own copy of Python and its own
      packages inside.

      ```
      critter-quest/
        .venv/            ← the backpack (a hidden folder, because of the dot)
        pyproject.toml    ← the packing list: what SHOULD be in the backpack
        uv.lock           ← the receipt: the exact versions that ARE in it
        critters/
        tests/
      ```

      **Never put the backpack in git.** It's big, and anyone can re-pack it
      from the packing list. Add `.venv/` to your `.gitignore`.
  - title: uv packs the backpack for you
    body: |
      **uv** is a super-fast helper that makes the backpack, packs it, and
      keeps the packing list tidy:

      | Command | What it does |
      |---|---|
      | `uv init --bare --no-workspace` | start a packing list (`pyproject.toml`) for this project |
      | `uv add cowsay` | download a package and add it to the list |
      | `uv add --dev pytest` | add a tool *you* need while building (the dev pocket) |
      | `uv run python fun.py` | run a file using the backpack |
      | `uv sync` | re-pack the backpack exactly from the list (great on a new computer) |
      | `uv remove cowsay` | take a package back out |

      In the game, put `!` in front: `!uv add cowsay`.

      **Bonus:** once your project has a backpack, the game's `python` and
      `pytest` commands use it automatically. They'll tell you so!
  - title: The packing list and the receipt
    body: |
      After `uv add`, open `pyproject.toml` (`cat pyproject.toml`):

      ```toml
      [project]
      name = "critter-quest"
      version = "0.1.0"
      dependencies = [
          "cowsay>=6.1",          # packages the game needs
      ]

      [dependency-groups]
      dev = [
          "pytest>=8",            # tools for building it
      ]
      ```

      * **`pyproject.toml`** is the packing list. You (and uv) edit it.
      * **`uv.lock`** is the receipt: the *exact* versions uv picked. Don't
        edit it by hand, but **do** save it in git, so everyone (including the
        CI robot!) packs exactly the same backpack.

      A **dependency** just means "a package my project depends on".
quest:
  title: Pack Your Backpack
  brief: |
    Give *critter-quest* its own backpack. In the game, type each command
    with `!` in front:

    1. `!uv init --bare --no-workspace` makes the packing list, `pyproject.toml`
    2. `!uv add --dev pytest` puts pytest in the dev pocket. This creates the
       backpack (`.venv`) and the receipt (`uv.lock`)!
    3. `!uv add cowsay` borrows a fun package (or `pyfiglet` for giant letters,
       if you prefer)
    4. Make **`fun.py`**, which **imports** your package and uses it to show
       something about your critter. Run it: `python fun.py`
    5. Add `.venv/` to **`.gitignore`** (`edit .gitignore`)
    6. Run `pytest`. Your tests now run from the backpack, and must still be green!
  check: backpack_burrow
  scaffold: [fun.py]
  hints:
    - "Type the commands exactly, with `!` first: `!uv init --bare --no-workspace`. If `uv` isn't found, ask whoever installed the game to install uv."
    - "Using cowsay: `import cowsay` at the top, then `cowsay.cow(\"Sparky is ready to battle!\")`. With pyfiglet: `import pyfiglet` then `print(pyfiglet.figlet_format(\"Sparky\"))`."
    - "`.gitignore` already exists. Add a new line with `.venv/` on it."
    - "No `.venv` folder in your project? You probably left out `--no-workspace`. `ask barnaby about no workspace`."
  solution:
    files:
      fun.py: fun.py
      .gitignore: .gitignore
    commands:
      - uv init --bare --no-workspace
      - uv add --dev pytest
      - uv add cowsay
  commit_message: "Give critter-quest its own backpack (virtual environment) with uv"
  reward:
    xp: 200
    item:
      name: Barnaby's Backpack
      aliases: [backpack]
      text: |
        **package** = code someone else wrote (like a Scratch extension), from **PyPI**
        **virtual environment** (`.venv`) = your project's own backpack of packages

        ```
        uv init --bare --no-workspace   # start the packing list (pyproject.toml)
        uv add cowsay                   # borrow a package
        uv add --dev pytest             # a tool for building (dev pocket)
        uv run python fun.py            # run with the backpack
        uv sync                         # re-pack from the list (new computer!)
        ```

        Save `pyproject.toml` and `uv.lock` in git. **Never** `.venv/`.
