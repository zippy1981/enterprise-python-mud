id: tidy_treehouse
name: The Tidy Treehouse
order: 4
zone: Organizing your code
description: |
  A rope ladder leads up to a treehouse with a place for everything: drawers
  labelled **actions**, **rules** and **team**, shelves of neatly sorted
  pebbles, and a sign saying `MAX_SHINY = 100`. A magpie straightens a
  crooked label for the third time.
exits:
  east: testing_meadow
  north: backpack_burrow
npc:
  name: Marigold the Magpie
  aliases: [marigold, magpie]
  greeting: |
    "Ah, a visitor! Mind the pebbles, they're sorted by shininess.

    Your project is growing, and growing projects get **messy**: files
    everywhere, mystery numbers like `100` and `20` scattered about, and
    nobody can remember what does what. A messy room is hard to find things in.
    Messy code is hard to change.

    Let's tidy up. You'll put your critter code in its own **folder** (a
    *package*), give those mystery numbers **names**, and leave a note on
    every function saying what it does. And because you wrote tests, you'll
    know you didn't break anything!"
  topics:
    magic numbers: |
      "A **magic number** is a number in your code with no explanation. Why
      100? Why 20? Give it a name in CAPITALS, like `MAX_HEALTH = 100`.
      CAPITALS mean 'this is a setting, don't change it while the game runs'.
      Then if you want max health to be 150, you change **one** line, not ten."
    docstrings: |
      "A **docstring** is a note in triple quotes, right under the `def` line:
      ```python
      def feed(health, snack):
          """Give the critter a snack. Health never goes above MAX_HEALTH."""
      ```
      Editors like VS Code show it when you hover over the function. It's a
      comment that tools can read!"
    refactoring: |
      "Changing how code is **organized** without changing what it **does** is
      called **refactoring**. It's the 🧹 *Tidy* step of red-green-tidy. Your
      tests are what make it safe: if they're still green afterwards, you
      didn't break anything."
    git mv: |
      "Moving a file with `!git mv actions.py critters/actions.py` tells git
      it's the same file in a new place, so its history comes along too. The
      game commits for you when you finish a quest, and `log` shows the
      history."
pages:
  - title: Why tidy code matters
    body: |
      Imagine looking for your favourite hoodie in a room where everything is
      on the floor. Now imagine a room with labelled drawers. **Code is the
      same.**

      Tidy code has:

      * **Good names** for variables and functions (you did this already!)
      * **Small functions** that each do **one job**
      * **No magic numbers**: settings get names, like `MAX_HEALTH`
      * **Notes** (docstrings) explaining what each function is for
      * **Files grouped into folders** by what they're about

      Coders say code is read **many more times** than it's written. Usually
      by you, three weeks later, having forgotten everything!
  - title: Folders of code (packages)
    body: |
      A file of Python code is called a **module**. A folder of modules, with
      a special file called `__init__.py` inside, is called a **package**.

      ```
      critter-quest/
        hello.py
        critter.py
        critters/              ← the package (a folder)
          __init__.py          ← makes it a package (it can be empty!)
          rules.py             ← the game's settings
          actions.py           ← what critters can do
        tests/
          test_actions.py
      ```

      Use code from one module in another with **import**:

      ```python
      from critters.rules import MAX_HEALTH         # in critters/actions.py
      from critters.actions import feed, rest       # in your tests
      ```

      Read it as: "from the `critters` folder, the `rules` file, bring me
      `MAX_HEALTH`."
  - title: Names for numbers, notes for functions
    body: |
      **Before**, with mystery numbers:

      ```python
      def feed(health, snack):
          return min(health + snack, 100)
      ```

      **After**, tidy:

      ```python
      # critters/rules.py
      MAX_HEALTH = 100       # health can never go higher than this
      MAX_ENERGY = 100       # nor can energy
      TIRED_BELOW = 20       # critters with less energy than this are tired
      REST_PER_HOUR = 10     # energy gained for each hour of sleep
      ```

      ```python
      # critters/actions.py
      from critters.rules import MAX_ENERGY, MAX_HEALTH, REST_PER_HOUR, TIRED_BELOW


      def feed(health, snack):
          """Give the critter a snack. Health never goes above MAX_HEALTH."""
          return min(health + snack, MAX_HEALTH)
      ```

      Now the code *explains itself*. And to make critters tougher, you change
      one line in `rules.py`.
quest:
  title: Tidy the Treehouse
  brief: |
    Reorganize your project **without changing what it does**:

    1. Make a **`critters/`** folder with an empty **`critters/__init__.py`**
    2. Move your actions into it: `!mkdir critters` then
       `!git mv actions.py critters/actions.py`
    3. Make **`critters/rules.py`** with `MAX_HEALTH = 100`, `MAX_ENERGY = 100`,
       `TIRED_BELOW = 20` and `REST_PER_HOUR = 10`. (Health and energy are both
       100 today, but they're different ideas, so they get different names!)
    4. In `critters/actions.py`, **import** those names and use them instead
       of the numbers 100, 20 and 10. No magic numbers left!
    5. Give **every** function in `critters/actions.py` a **docstring**
    6. Update `tests/test_actions.py` to import from `critters.actions`,
       then run `pytest`. Still green? You refactored safely! 🎉
  check: tidy_treehouse
  scaffold:
    critters/__init__.py: __init__.py
    critters/rules.py: rules.py
  hints:
    - "Make the folder before moving: `!mkdir critters`, then `!git mv actions.py critters/actions.py`. (`scaffold` also creates the folder.)"
    - "At the top of `critters/actions.py`: `from critters.rules import MAX_ENERGY, MAX_HEALTH, REST_PER_HOUR, TIRED_BELOW`"
    - "A docstring is the first line inside a function, in triple quotes: `\"\"\"Give the critter a snack.\"\"\"`"
    - "In the test file, change `from actions import ...` to `from critters.actions import ...`"
  solution:
    files:
      critters/__init__.py: __init__.py
      critters/rules.py: rules.py
      critters/actions.py: actions.py
      tests/test_actions.py: test_actions.py
    commands:
      - git rm -q actions.py
  commit_message: "Tidy up: move actions into the critters package and name the magic numbers"
  reward:
    xp: 250
    item:
      name: Marigold's Label Maker
      aliases: [label, maker]
      text: |
        ```
        critters/            a package: a folder with __init__.py
          __init__.py
          rules.py           MAX_HEALTH = 100    (CAPITALS = a setting)
          actions.py         from critters.rules import MAX_HEALTH
        ```

        ```python
        def feed(health, snack):
            """Give the critter a snack. Health never goes above MAX_HEALTH."""
            return min(health + snack, MAX_HEALTH)
        ```

        **Tidy code:** good names · one job per function · no magic numbers ·
        docstrings · related code in the same file. **Refactor** with your tests green.
