# This file is itself a lesson: compare it with the one you write in the TOML Forge.
[project]
name = "azurath"
version = "0.1.0"
description = "A MUD that teaches enterprise Python on Azure to C#/PowerShell developers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Justin Dearing" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
# `uv run azurath` (or `azurath` once the venv is active) calls azurath.cli:main
azurath = "azurath.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azurath"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not slow"]   # `uv run pytest -m slow` runs the full walkthrough
markers = [
    "slow: plays the whole game with the reference solutions (needs network, uv and Go)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/azurath/content/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Checks embed whole probe scripts in string literals; the formatter can't wrap those.
"src/azurath/checks/*.py" = ["E501"]
