id: pythonwood
name: The Pythonwood
tagline: Your first real Python project, for curious 13-year-olds
audience: |
  Around age 13, with grade-school coding experience (Scratch, code.org, maybe a
  little Python), but no professional experience. Lessons stress variables,
  functions and keeping code tidy, and teach testing (red, green, tidy), packages
  and virtual environments with uv, and a CI robot, all in kid-sized steps. Each quest adds a piece to a small critter
  battle game.
order: 1
start: trailhead_guided
workspace: critter-quest
# Copied into the player's project (never overwriting) from this dungeon's template/ folder.
workspace_files:
  .vscode/settings.json: vscode-settings.json
  .vscode/extensions.json: vscode-extensions.json
# The game's `code` command opens the project in this VS Code profile. A new profile has
# no extensions, so AI assistants aren't loaded; only these get installed into it.
vscode_profile: Pythonwood
vscode_extensions: [ms-python.python]
ranks:
  - [0, Seedling]
  - [100, Sprout]
  - [300, Sapling]
  - [700, Trail Coder]
  - [1200, Forest Ranger]
  - [1700, Code Druid]
  - [2450, Guardian of the Pythonwood]
intro: |
  Welcome to **the Pythonwood**, a forest where code grows on trees. 🌲

  If you've made things in **Scratch** or done a little coding at school,
  you're ready. Here you'll write real **Python**, the same language used to
  build games, websites and robots, and you'll build a project of your own: a
  **critter battle game** called *critter-quest*.

  Every room has a friendly mentor, a short lesson and a quest. Finish the
  quest and the path to the next room opens.

  Each lesson comes in **two rooms**. First a **guided path**: the code is
  already written but switched off, and you switch on (uncomment) the right
  line in each step. Then the **lesson room**, where you write the code
  yourself, and test it!

  The commands you'll use most:

  * **`look`** to see where you are
  * **`read`** to read the lesson (type it again to turn the page)
  * **`talk`** to chat with the mentor
  * **`quest`** to see your task
  * **`check`** when you think you're done
  * **`help`** to see every command

  Don't worry about mistakes. Errors are just Python telling you what to fix.
readme: |
  # critter-quest

  A critter battle game, built one quest at a time in **the Pythonwood**.

  Every commit in this repository is a quest you completed. Type `log` in the
  game to see them all!
