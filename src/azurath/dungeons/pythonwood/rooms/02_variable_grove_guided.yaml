id: variable_grove_guided
name: The Acorn Path
order: 2
guided: true
zone: "Variables: making them, and their types"
description: |
  A narrow path winds between rows of empty glass jars, each with a blank
  paper label. A squirrel waves a paw at you from a pile of acorns,
  pencil behind her ear, ready to label things.
exits:
  south: trailhead
  east: variable_grove_guided_math
npc:
  name: Bramble the Squirrel
  aliases: [bramble, squirrel]
  greeting: |
    "Oh good, you're here! Five little paths lead to my grove, and each one
    teaches one thing about **variables**. This first one is the most
    important: how to **make** a variable, and the different **types** of
    value a jar can hold."
  topics:
    types: |
      "`int` is a whole number, `float` a decimal number, `str` some text in
      quotes, and `bool` just `True` or `False`. `type(x)` tells you which!"
    names: |
      "Names are snake_case (lowercase words joined by `_`), with no spaces, and
      they can't start with a number. The name goes on the LEFT of `=`."
pages:
  - title: Making a variable
    body: |
      A **variable** is a labelled jar. You make one with `=`. The **name**
      goes on the left and the **value** on the right:

      ```python
      pet_name = "Pip"     # str: text, always in quotes
      age = 3              # int: a whole number
      height = 1.5         # float: a decimal number (with a DOT, not a comma)
      is_hungry = True     # bool: True or False, with a capital letter
      ```

      | Type | Looks like | Careful! |
      |---|---|---|
      | `str` | `"Pip"`, `"3"` | `"3"` is text that *looks* like a number |
      | `int` | `3`, `-7` | no quotes, no dot |
      | `float` | `1.5`, `0.25` | a dot, never a comma |
      | `bool` | `True`, `False` | capital letter, no quotes |

      Ask Python what type a value is with `type()`:

      ```python
      print(type(age))     # <class 'int'>
      ```
  - title: Step by step
    body: |
      Your practice file is **`practice/acorns.py`**.

      * **STEP 1:** no spaces in a name, and the name goes on the left of `=`.
      * **STEP 2:** a number has no quotes.
      * **STEP 3:** decimals use a dot. (`1,5` makes something else entirely!)
      * **STEP 4:** capital `T`, no quotes.
      * **STEP 5:** `type()` is a function: the thing goes *inside* the brackets.

      `python practice/acorns.py` should print `<class 'float'>` and then
      `Pip 3 1.5 True`.

      **How to do a guided path:** `scaffold` gives you the practice file. Each STEP
      has a few choices with a `#` in front, and only one is right. Uncomment the
      right one by deleting the `#` **and the space after it**. The quick way is to
      click the line and press **Ctrl+/** (**Cmd+/** on a Mac). Then `python` the
      file and `check`.
quest:
  title: "Practise at The Acorn Path"
  brief: |
    Uncomment the right line in each STEP of **`practice/acorns.py`**, so that it
    prints:

    ```
    <class 'float'>
    Pip 3 1.5 True
    ```
  check: variable_grove_guided
  scaffold:
    practice/acorns.py: acorns.py
  hints:
    - "Variable names have no spaces (use `_`), and the name goes on the left of `=`."
    - "Numbers have no quotes. Decimals use a dot: `height = 1.5`."
    - "STEP 5 is `print(type(height))`."
  solution:
    files:
      practice/acorns.py: acorns.py
  commit_message: "Practise on the guided path: The Acorn Path"
  reward:
    xp: 50
