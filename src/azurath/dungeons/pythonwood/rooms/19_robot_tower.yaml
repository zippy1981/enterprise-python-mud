id: robot_tower
name: The Robot Tower
order: 19
zone: Save points & the CI robot
description: |
  A tall tower of brass and moss rises above the treetops. Inside, a friendly
  robot with a lantern for a head sits at a desk covered in green and red
  lights. A conveyor belt brings it bundles of code, and every time one
  arrives, it runs every single test, beeps, and lights up a light.
exits:
  west: robot_tower_guided
  north: critter_arena_guided
npc:
  name: Bolt the Robot
  aliases: [bolt, robot]
  greeting: |
    "BEEP BOOP. GREETINGS, CODER. I AM A **CI ROBOT**.

    ...Sorry, I'll stop shouting. CI stands for **Continuous Integration**. That
    just means that every time you share new code, a robot (me!) runs all your
    tests automatically, on a fresh computer, and tells everyone whether
    they're green.

    You remember to run `pytest`. *Mostly.* I remember **every single time**.
    Today you'll write my instructions: a little file telling me how to test
    your project."
  topics:
    git: |
      "**git** keeps save points of your project, called **commits**. The game
      has been making one for you every time you finished a quest! Type `log`
      to see them. You can always go back to an old save point, so you can
      experiment without fear."
    github: |
      "**GitHub** is a website that stores git projects online, so you can share
      them and the CI robot can run. **You must be at least 13 to have an
      account, and you should ask a parent, guardian or teacher before making
      one.** Pushing is optional for this quest. Your robot instructions count
      either way!"
    yaml: |
      "My instructions are written in **YAML**, a format for settings. Indentation
      (spaces at the start of lines) shows what belongs to what, like folders
      inside folders. Use spaces, never tabs, and line things up carefully!"
    green badge: |
      "On GitHub, my results show up as a ✅ or ❌ next to every commit. Teams
      have a rule: **never break the build**. If the robot says red, fixing it
      comes first."
pages:
  - title: Save points with git
    body: |
      You've been using **git** all along without noticing! Every time you
      finished a quest, the game made a **commit**: a save point of your whole
      project, with a message saying what changed.

      ```
      log        ← in the game: shows your save points
      ```

      Like save points in a video game, commits let you go back if something
      goes wrong. They also tell the **story** of your project: each message
      says what you did and when.

      **GitHub** stores your git project online. Sending your commits there is
      called **pushing**. When you push, the CI robot wakes up.
  - title: Meet the CI robot
    body: |
      Even great coders forget to run their tests. So teams use a robot that
      runs them **automatically**:

      1. You push your commits to GitHub
      2. 🤖 The robot gets a brand-new computer
      3. It downloads your code and packs a backpack from your **packing list**
         (`pyproject.toml` and `uv.lock`), exactly like yours
      4. It runs **all** your tests
      5. ✅ green or ❌ red appears next to your commit, for everyone to see

      This is **CI: Continuous Integration**. "Continuous" because it happens
      every time, and "integration" because it checks that everyone's code
      works *together*.

      Why a fresh computer? It proves your project works **everywhere**, not
      just on your laptop. "It works on my machine" isn't good enough for Bolt!
  - title: Writing the robot's instructions
    body: |
      On GitHub, the robot is called **GitHub Actions**. Its instructions go in
      a YAML file in a special folder, `.github/workflows/`:

      ```yaml
      name: Tests                      # what to call this robot job

      on: [push, pull_request]         # WHEN to run: every push

      jobs:
        test:
          runs-on: ubuntu-latest       # WHERE: a fresh Linux computer
          steps:                       # WHAT to do, in order
            - uses: actions/checkout@v4          # 1. download my code
            - uses: astral-sh/setup-uv@v6        # 2. get uv
            - run: uv run python -m pytest       # 3. pack the backpack and run all my tests!
      ```

      * `uses:` borrows a ready-made step someone else wrote (like a package!).
      * `run:` types a command, like you would in a terminal.
      * `uv run` packs the backpack from `uv.lock` first, so the robot gets exactly
        the same versions of everything that you have. Remember the receipt?
      * **Indentation matters**: the steps belong to the job, which belongs to `jobs`.
quest:
  title: Program the Robot
  brief: |
    Write the CI robot's instructions in **`.github/workflows/tests.yml`**:

    * run `on` every **push**
    * one job that `runs-on` **ubuntu-latest**
    * steps that: download your code (`actions/checkout`), get uv
      (`astral-sh/setup-uv`), and run your tests from the backpack with
      `uv run python -m pytest`

    Make sure `pyproject.toml` and `uv.lock` are saved in git (the game does it
    when you finish a quest), because the robot needs your packing list!

    The robot will also run **all** your tests now, so make sure `pytest` is
    green!

    *Optional, and only with a grown-up's OK:* put your project on GitHub and
    watch the robot run (`ask bolt about github`).
  check: robot_tower
  scaffold:
    .github/workflows/tests.yml: tests.yml
  hints:
    - "`scaffold` writes most of the file for you. Fill in the missing steps under `steps:`."
    - "Each step starts with `- ` and lines up with the steps above it. A step uses either `uses:` (a ready-made step) or `run:` (a command)."
    - "The last two steps are `- uses: astral-sh/setup-uv@v6` and `- run: uv run python -m pytest`."
  solution:
    files:
      .github/workflows/tests.yml: tests.yml
  commit_message: "Add a CI robot that runs my tests on every push"
  reward:
    xp: 200
    item:
      name: Bolt's Spare Battery
      aliases: [battery]
      text: |
        **git:** commits are save points (`log` shows them) · pushing sends them to GitHub
        **CI:** a robot runs **all** your tests on **every** push, on a fresh computer

        ```yaml
        on: [push, pull_request]
        jobs:
          test:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: astral-sh/setup-uv@v6
              - run: uv run python -m pytest
        ```

        **Never break the build:** if the robot says red, fix it first!
