id: variable_grove
name: Variable Grove
order: 7
zone: Variables
description: |
  Hundreds of glass jars hang from the branches, each with a neat paper label:
  `acorns = 12`, `favorite_color = "green"`, `is_raining = False`. A squirrel
  scurries between them, swapping what's inside and carefully re-tying the
  labels.
exits:
  south: variable_grove_guided_increment
  east: function_falls_guided
npc:
  name: Bramble the Squirrel
  aliases: [bramble, squirrel]
  greeting: |
    "Oh! Hello! Sorry, busy busy busy. These jars are **variables**: a label on
    the outside, a value on the inside. You've used them in Scratch: the orange
    **set my score to 0** block made one!

    In Python you make a variable just by giving it a value:

    ```python
    acorns = 12
    ```

    Today you'll make **your critter**, the hero of your game, out of
    variables. What will you call it? I'm partial to squirrels, myself..."
  topics:
    naming: |
      "Names matter more than you'd think! A good name says what's *in* the jar.

      * ✅ `critter_name`, `health`, `top_speed`, `is_sleepy`
      * ❌ `x`, `thing`, `n2`, `a`

      Python style is **snake_case**: lowercase words joined by underscores.
      Names can't start with a number or contain spaces, and they're
      case-sensitive, so `Health` and `health` are two different jars!"
    equals: |
      "In Python, `=` means **put this value in this jar**. It doesn't mean
      'is equal to'. So `score = score + 1` makes sense: take what's in `score`,
      add 1, and put the answer back in. (To *ask* whether two things are equal,
      Python uses `==`. You'll meet that later.)"
    types: |
      "The values in jars come in different kinds, called **types**:

      * `int`: whole numbers like `12` or `-3`
      * `float`: numbers with a decimal point, like `3.5`
      * `str`: a string of text in quotes, like `"Sparky"`
      * `bool`: just `True` or `False` (with capital letters!)

      Ask Python what's in a jar with `type(health)`."
    math: |
      "Python is a great calculator: `+`, `-`, `*` (times), `/` (divide),
      `//` (divide and round down), `%` (the remainder), `**` (power). Try
      `print(7 // 2)` and `print(7 % 2)`."
pages:
  - title: Jars with labels
    body: |
      A **variable** is a name that holds a value. You make one with `=`:

      ```python
      critter_name = "Sparky"
      health = 30
      is_sleepy = False
      ```

      Now whenever you write `health`, Python looks inside the jar:

      ```python
      print(health)          # shows: 30
      health = health - 5    # Sparky got bonked!
      print(health)          # shows: 25
      ```

      | Scratch | Python |
      |---|---|
      | **set** health **to** 30 | `health = 30` |
      | **change** health **by** -5 | `health = health - 5` (or `health -= 5`) |
      | a reporter block showing *health* | `print(health)` |
  - title: Kinds of values
    body: |
      | Type | Example | Used for |
      |---|---|---|
      | `str` (string) | `"Sparky"` | names, messages, any text |
      | `int` (integer) | `30` | counting, scores, health |
      | `float` | `2.5` | measurements, speeds with decimals |
      | `bool` (boolean) | `True` / `False` | yes-or-no questions |

      **Quotes make a string.** `"30"` is text that looks like a number, and
      `30` is an actual number you can do maths with:

      ```python
      print(30 + 5)       # 35
      print("30" + "5")   # 305  (strings stick together!)
      ```

      Booleans usually get names that sound like yes/no questions:
      `is_sleepy`, `has_key`, `can_fly`.
  - title: f-strings put variables in sentences
    body: |
      Put an **f** before the quotes. Then, inside `{curly braces}`, write a
      variable's **name**. Python looks inside that jar and swaps in its value:

      ```python
      critter_name = "Sparky"
      health = 30
      print(f"{critter_name} has {health} health.")
      # Sparky has 30 health.
      ```

      ⚠️ **Names go in the braces, not values.** Write the *label on the jar*,
      not what's inside it:

      | You write | What happens |
      |---|---|
      | `f"{critter_name} has {health} health."` | ✅ `Sparky has 30 health.` and it changes if the jars change |
      | `f"{Sparky} has {30} health."` | ❌ `NameError`: there's no jar labelled `Sparky` |
      | `f"{"Sparky"} has {30} health."` | 😐 works, but it's stuck saying Sparky and 30 forever, so why use braces? |

      The whole point is that the sentence **follows the variables**. If Sparky
      gets bonked and `health` becomes 25, the same f-string says 25.

      It's like Scratch's **join** block, only much neater. You can even do
      maths with variables inside the braces: `f"Half health: {health // 2}"`.

      **Pick names a friend could understand.** If your friend read
      `print(f"{n} has {h}")`, would they know what it means? Compare it with
      `print(f"{critter_name} has {health} health")`. Good names are the
      first step to tidy code.
quest:
  title: Create Your Critter
  brief: |
    Make **`critter.py`** describing *your* critter with these variables:

    | Variable | Type | Example |
    |---|---|---|
    | `critter_name` | string | `"Sparky"` |
    | `species` | string | `"lightning squirrel"` |
    | `health` | whole number from 6 to 100 | `30` |
    | `speed` | whole number, 0 or more | `7` |
    | `is_sleepy` | `True` or `False` | `False` |

    Then use an **f-string** to `print` a sentence that includes your
    critter's name **and** its health. Inside the `{ }` put the variable
    **names** (`{critter_name}`, `{health}`), not the values (`{"Sparky"}`, `{30}`).

    **Then your critter gets bonked!** Use `-=` (from the Tally Tree) to take 5
    away from `health`, and `print` the **same** f-string sentence again. Watch
    it show the new health all by itself.

    Every variable name must be **snake_case** and at least 3 letters long.
    No `x` or `n`!
  check: variable_grove
  scaffold: [critter.py]
  hints:
    - "Each variable is one line: `name = value`. Text goes in quotes. Numbers and `True`/`False` don't."
    - "`True` and `False` need capital letters. `true` is a NameError."
    - "Inside the braces go variable NAMES, never the values: `{health}`, not `{30}`. Then the sentence updates itself when the variable changes."
    - "The bonk is one line, `health -= 5`, and then the exact same `print(f\"...\")` line again."
    - "Your sentence could be: `print(f\"{critter_name} the {species} has {health} health!\")`"
  solution:
    files: [critter.py]
  commit_message: "Create my critter with variables"
  reward:
    xp: 150
    item:
      name: Bramble's Acorn Jar
      aliases: [jar, acorn]
      text: |
        ```python
        critter_name = "Sparky"    # str: text, in quotes
        health = 30                # int: whole number
        speed = 2.5                # float: decimal number
        is_sleepy = False          # bool: True or False
        health = health - 5        # change a variable (or: health -= 5)
        print(f"{critter_name} has {health} health")   # f-string: NAMES in the { }
        health -= 5                # take 5 away (+= adds, -= takes away)
        print(type(health))        # what kind of value is it?
        ```

        **Good names:** snake_case, describe what's inside, yes/no names for bools.
