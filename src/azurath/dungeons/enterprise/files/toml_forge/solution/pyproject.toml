# pyproject.toml: the Python equivalent of a .csproj

[project]
name = "questboard"
version = "0.1.0"
description = "The Guild's quest board, an Azure Functions app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # make the repo root importable in tests (function_app.py lives there)
