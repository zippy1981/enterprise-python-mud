# Instructions for the CI robot (GitHub Actions).
name: Tests

on: [push, pull_request] # run every time code is pushed

jobs:
  test:
    runs-on: ubuntu-latest # a fresh Linux computer
    steps:
      - uses: actions/checkout@v4 # 1. download my code
      - uses: astral-sh/setup-uv@v6 # 2. get uv
      - run: uv run python -m pytest # 3. pack the backpack and run all the tests!
